# Bonni Core v0.1.21 – AMD64
# Vor dem ersten Start die drei BITTE-Werte durch eigene Werte ersetzen.
# DB: mindestens 24 Zeichen; MASTER_KEY: mindestens 43 Zeichen.
# Admin: mindestens 16 Zeichen, Groß-/Kleinbuchstaben, Zahl und Sonderzeichen.
# Keine Dollarzeichen oder einfachen Anführungszeichen in diesen Werten.
# Datenordner: absoluter, dauerhaft gespeicherter Pfad auf diesem Server.
# Core, Datenbank und Update-Dienst werden automatisch eingerichtet.

x-bonni-root: &bonni_root /var/lib/bonni-core

services:
  # Image-Referenz für Download/Offline-Export; der Controller startet die DB.
  db:
    profiles: [bonni-images]
    image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
    platform: linux/amd64

  bonni-core:
    image: ghcr.io/bonni-community/bonni-core:0.1.21
    platform: linux/amd64
    init: true
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      BONNI_HOST_PROJECT_ROOT: *bonni_root
      BONNI_INITIAL_IMAGE: ghcr.io/bonni-community/bonni-core:0.1.21
      BONNI_DATABASE_IMAGE: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
      BONNI_PLATFORM: linux/amd64
      BONNI_OFFLINE: "false"
      BONNI_HTTP_PORT: "4000"
      POSTGRES_PASSWORD: "BITTE_EIGENES_DATENBANKKENNWORT_EINTRAGEN"
      MASTER_KEY: "BITTE_EIGENEN_ZUFAELLIGEN_MASTER_KEY_EINTRAGEN"
      BONNI_BOOTSTRAP_ADMIN_PASSWORD: "BITTE_EIGENES_ADMIN_KENNWORT_EINTRAGEN"
    command: ["/bin/bash", "/app/backend/scripts/deployment/entrypoint.sh"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: *bonni_root
        target: *bonni_root
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "/app/backend/scripts/deployment/controller.mjs", "--health"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 90s
    stop_grace_period: 10m
    security_opt: ["no-new-privileges:true"]
