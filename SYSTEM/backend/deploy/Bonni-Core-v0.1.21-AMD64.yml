# Bonni Core v0.1.21 – AMD64
# Docker Compose: passende Architektur wählen und diese YAML verwenden.
# Vor dem Start die DREI BITTE-Werte unten durch eigene Werte ersetzen.
# DB-Kennwort: mindestens 24 Zeichen. MASTER_KEY: mindestens 43 Zeichen.
# Admin: mindestens 16 Zeichen, Groß-/Kleinbuchstaben, Zahl und Sonderzeichen.
# Für Passwörter kein Dollarzeichen verwenden (Compose-Interpolation).
# Anwendung immer gleich benennen: bonni-core. Daten-Volumes behalten!
# Einzelbetrieb: Core + PostgreSQL. Der externe Update-/Notlauf-Stack ist separat.

x-bonni-environment: &bonni_environment
  POSTGRES_PASSWORD: &db_password "BITTE_EIGENES_DATENBANKKENNWORT_EINTRAGEN"
  MASTER_KEY: "BITTE_EIGENEN_ZUFAELLIGEN_MASTER_KEY_EINTRAGEN"
  BONNI_BOOTSTRAP_ADMIN_PASSWORD: "BITTE_EIGENES_ADMIN_KENNWORT_EINTRAGEN"
  BONNI_BOOTSTRAP_FIRST_INSTALL_ONLY: "true"
  NODE_ENV: production
  PORT: "4000"
  LOCAL_AUTH_BIND: 0.0.0.0
  LOCAL_AUTH_PORT: "4001"
  SYSTEM_VERSION: "0.1.21"
  SYSTEM_SLOT_ROLE: active
  SYSTEM_SLOT_NAME: backend-single
  AUTH_MODE: LOCAL
  DATABASE_OPERATION_MODE: server-only
  BONNI_PROJECT_ROOT: /app
  RUN_SYSTEM_ROOT: /app/run_system
  BONNI_STORAGE_ROOT: /app/storage
  MEDIA_STORAGE_ROOT: /app/storage/media
  FRONTEND_DIST_ROOT: /app/public
  TZ: Europe/Berlin

services:
  db:
    image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: bonni
      POSTGRES_DB: bonni_core
      POSTGRES_PASSWORD: *db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonni -d bonni_core"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [database]

  bonni-core:
    image: ghcr.io/bonni-community/bonni-core:0.1.21
    platform: linux/amd64
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *bonni_environment
    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="$$(node -e 'const e=process.env; for (const [k,n] of [["POSTGRES_PASSWORD",24],["MASTER_KEY",43],["BONNI_BOOTSTRAP_ADMIN_PASSWORD",16]]) { if (!e[k] || e[k].length<n || /BITTE_|change.?me|example|placeholder/i.test(e[k])) throw Error("Bitte eigenen Wert setzen: "+k); } process.stdout.write("postgresql://bonni:"+encodeURIComponent(e.POSTGRES_PASSWORD)+"@db:5432/bonni_core?schema=public");')"
        test -n "$$DATABASE_URL"
        export SERVER_DATABASE_URL="$$DATABASE_URL"
        node scripts/runtime/bootstrap-production-database.mjs
        npm run backup:restore-pending
        exec npm run start
    ports:
      - "4000:4000"
    volumes:
      - core_storage:/app/storage
      - run_system:/app/run_system
      - core_logs:/app/backend/archives/logs
      - core_apps:/app/app
      - core_addons:/app/addons
      - core_plugins:/app/plugins
      - core_bridges:/app/bridges
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    stop_grace_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [database, frontend]

volumes:
  postgres_data:
  core_storage:
  run_system:
  core_logs:
  core_apps:
  core_addons:
  core_plugins:
  core_bridges:

networks:
  database:
    internal: true
  frontend:
