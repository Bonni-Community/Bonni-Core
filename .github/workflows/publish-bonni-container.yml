name: Publish Bonni Core container

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing Bonni release or new draft identifier
        required: true
        type: string
      asset_id:
        description: Signed Bonni container asset identifier
        required: true
        type: string
      asset_sha256:
        description: Expected SHA-256 of the signed asset
        required: true
        type: string
      version:
        description: Bonni Core version
        required: true
        type: string
      image:
        description: Fully qualified lower-case GHCR image name
        required: true
        type: string
      platforms:
        description: Selected container architectures
        required: true
        default: linux/amd64,linux/arm64,linux/arm/v7
        type: choice
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
          - linux/arm/v7
          - linux/amd64,linux/arm/v7
          - linux/arm64,linux/arm/v7
          - linux/amd64,linux/arm64,linux/arm/v7

permissions:
  contents: write
  packages: write

concurrency:
  group: bonni-container-publication-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build selected container architectures
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      ASSET_SHA256: ${{ inputs.asset_sha256 }}
      VERSION: ${{ inputs.version }}
      PLATFORMS: ${{ inputs.platforms }}
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Validate the existing release and publication plan
        run: |
          set -euo pipefail
          cat > bonni-release-reconcile.mjs <<'BONNI_RECONCILE_SCRIPT'
          function canonicalContainerPlatforms(raw) {
            const supported = ["linux/amd64", "linux/arm64", "linux/arm/v7"];
            if (!Array.isArray(raw) || !raw.length || raw.length > supported.length
              || new Set(raw).size !== raw.length || raw.some(p => !supported.includes(p))) {
              throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            }
            return supported.filter(p => raw.includes(p));
          }
          function containerArchitecture(platform) {
            const architecture = {"linux/amd64": "AMD64", "linux/arm64": "ARM64", "linux/arm/v7": "ARMv7"}[platform];
            if (!architecture) throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            return architecture;
          }
          function containerBundles(version, platforms) {
            if (!/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)) throw new Error("CONTAINER_VERSION_INVALID");
            const selected = canonicalContainerPlatforms(platforms);
            const bundles = selected.map(platform => {
              const architecture = containerArchitecture(platform);
              const prefix = platform === "linux/arm/v7" ? "32-Bit" : "64-Bit";
              const folder = `${prefix}-Bonni-Core-v${version}-${architecture}`;
              return {folder, filename: folder + ".zip", platform, architecture,
                variants: [{platform, architecture, subfolder: ""}]};
            });
            // One Raspi package always contains both variants. Never publish a partial
            // Raspi ZIP when only one of its required architectures was built.
            if (selected.includes("linux/arm64") && selected.includes("linux/arm/v7")) {
              const folder = `Raspi-Bonni-Core-v${version}`;
              bundles.push({folder, filename: folder + ".zip", variants: [
                {platform: "linux/arm/v7", architecture: "ARMv7", subfolder: "32-Bit-ARMv7"},
                {platform: "linux/arm64", architecture: "ARM64", subfolder: "64-Bit-ARM64"},
              ]});
            }
            return bundles;
          }
          function containerDownloadNames(version, platforms) {
            const files = canonicalContainerPlatforms(platforms).flatMap(platform => {
              const base = `Bonni-Core-v${version}-${containerArchitecture(platform)}`;
              return [".yml", ".yml.sha256", "-Offline.yml", "-Offline.yml.sha256", ".tar", ".tar.sha256", "-Datenbank.tar", "-Datenbank.tar.sha256"].map(suffix => base + suffix);
            });
            return files.concat(containerBundles(version, platforms).flatMap(b => [b.filename, b.filename + ".sha256"]));
          }
          async function reconcileContainerRelease({env = process.env, fetchImpl = globalThis.fetch, log = console.log} = {}) {
            const fs = await import("node:fs/promises");
            const {createReadStream} = await import("node:fs");
            const {createHash} = await import("node:crypto");
            const version = env.VERSION || "";
            const sha = env.ASSET_SHA256 || "";
            const platforms = (env.PLATFORMS || "").split(",");
            const repository = env.GITHUB_REPOSITORY || "";
            if (!/^[\w.-]+\/[\w.-]+$/.test(repository) || !/^[1-9][0-9]*$/.test(env.RELEASE_ID || "")
              || !/^\d+\.\d+\.\d+(?:-[a-z])?$/.test(version) || !/^[a-f0-9]{64}$/.test(sha)
              || canonicalContainerPlatforms(platforms).join(",") !== platforms.join(",")) throw Error("BONNI_RELEASE_INPUT_INVALID");
            const coreVersion = version.replace(/-([a-z])$/, "+$1");
            const prefix = "/repos/" + repository;
            const releasePath = prefix + "/releases/" + env.RELEASE_ID;
            const planPrefix = "<!-- bonni-container-plan:";
            const resultPrefix = "<!-- bonni-container-result:";
            async function api(relative, {method = "GET", json, file, size} = {}) {
              const headers = {Authorization: "Bearer " + env.GH_TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"};
              const options = {method, headers, redirect: "error"};
              if (json !== undefined) { headers["Content-Type"] = "application/json"; options.body = JSON.stringify(json); }
              if (file) {
                headers["Content-Type"] = "application/octet-stream";
                headers["Content-Length"] = String(size);
                options.body = createReadStream(file); options.duplex = "half";
              }
              const response = await fetchImpl((file ? "https://uploads.github.com" : "https://api.github.com") + relative, options);
              if (![200, 201, 204].includes(response.status)) throw Error("BONNI_RELEASE_API_" + response.status + "_" + method);
              return response.status === 204 ? null : response.json();
            }
            async function validate() {
              const release = await api(releasePath);
              const line = String(release.body || "").split("\n").find(line => line.startsWith(planPrefix) && line.endsWith(" -->"));
              const plan = line ? JSON.parse(line.slice(planPrefix.length, -4)) : null;
              if (release.tag_name !== "v" + coreVersion || release.immutable === true
                || !String(release.body).includes("<!-- bonni-windows-container-release -->")
                || plan?.schema !== "bonni.container-plan/v2" || plan.sourceSha256 !== sha
                || !/^[a-f0-9]{64}$/.test(plan.sourceFingerprint || "")
                || plan.imageRepository !== env.IMAGE || plan.imageTag !== version
                || plan.platforms?.join(",") !== platforms.join(",")) throw Error("BONNI_RELEASE_PLAN_CHANGED_OR_LOCKED");
              return {release, plan};
            }
            async function assets() {
              const result = [];
              for (let page = 1; page <= 50; page++) {
                const items = await api(releasePath + "/assets?per_page=100&page=" + page);
                if (!Array.isArray(items)) throw Error("BONNI_RELEASE_ASSETS_INVALID");
                result.push(...items);
                if (items.length < 100) return result;
              }
              throw Error("BONNI_RELEASE_ASSETS_LIMIT");
            }
            const expected = containerDownloadNames(coreVersion, platforms);
            const phase = env.BONNI_RELEASE_PHASE || "validate";
            const {release, plan} = await validate();
            if (phase === "validate") {
              if (env.GITHUB_OUTPUT) await fs.appendFile(env.GITHUB_OUTPUT, "release_tag=" + release.tag_name + "\n");
              return {releaseTag: release.tag_name, published: release.draft === false};
            }
            const local = [];
            for (const name of expected) {
              const file = (env.BONNI_ASSET_DIRECTORY || "compose-assets") + "/" + name;
              const stat = await fs.lstat(file);
              if (!stat.isFile() || stat.size === 0) throw Error("BONNI_RELEASE_FILE_INVALID: " + name);
              const hash = createHash("sha256");
              for await (const bytes of createReadStream(file)) hash.update(bytes);
              local.push({name, file, size: stat.size, digest: "sha256:" + hash.digest("hex")});
            }
            const current = await assets();
            const identical = (asset, file) => asset?.state === "uploaded" && asset.size === file.size && asset.digest === file.digest;
            if (phase === "assets") {
              if (!/^[0-9]+$/.test(env.GITHUB_RUN_ID || "") || !/^[0-9]+$/.test(env.GITHUB_RUN_ATTEMPT || "")) throw Error("BONNI_RUN_ID_INVALID");
              const suffix = env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT;
              const staged = [];
              try {
                // Stage every replacement before any old download is renamed or removed.
                for (const file of local) {
                  const old = current.find(asset => asset.name === file.name);
                  if (identical(old, file)) { log("Unverändert: " + file.name); continue; }
                  const stagedName = "bonni-staging-" + suffix + "-" + file.name;
                  const backupName = "bonni-backup-" + suffix + "-" + file.name;
                  if (current.some(asset => [stagedName, backupName].includes(asset.name))) throw Error("BONNI_RELEASE_STAGING_CONFLICT");
                  const item = {file, old, backupName, uploaded: null, oldRenamed: false, activated: false};
                  staged.push(item);
                  item.uploaded = await api(releasePath + "/assets?name=" + encodeURIComponent(stagedName), {method: "POST", file: file.file, size: file.size});
                  if (!identical(item.uploaded, file)) throw Error("BONNI_RELEASE_UPLOAD_CHECK_FAILED: " + file.name);
                }
                await validate();
                // Detect external asset edits since inventory, before replacing anything.
                const fresh = await assets();
                for (const item of staged) {
                  const found = fresh.find(asset => asset.name === item.file.name);
                  if (item.old ? found?.id !== item.old.id || found.updated_at !== item.old.updated_at : found) throw Error("BONNI_RELEASE_ASSET_CHANGED");
                }
                for (const item of staged) {
                  if (item.old) {
                    await api(prefix + "/releases/assets/" + item.old.id, {method: "PATCH", json: {name: item.backupName}});
                    item.oldRenamed = true;
                  }
                  await api(prefix + "/releases/assets/" + item.uploaded.id, {method: "PATCH", json: {name: item.file.name}});
                  item.activated = true;
                  log((item.old ? "Aktualisiert: " : "Ergänzt: ") + item.file.name);
                }
              } catch (error) {
                let restored = true;
                for (const item of staged.reverse()) {
                  try {
                    if (item.uploaded?.id) await api(prefix + "/releases/assets/" + item.uploaded.id, {method: "DELETE"});
                    if (item.oldRenamed) await api(prefix + "/releases/assets/" + item.old.id, {method: "PATCH", json: {name: item.file.name}});
                  } catch { restored = false; }
                }
                if (!restored) throw Error("BONNI_RELEASE_ROLLBACK_INCOMPLETE_BACKUPS_RETAINED", {cause: error});
                throw error;
              }
              // Old downloads are discarded only after all replacements succeeded.
              for (const item of staged) if (item.old) {
                try { await api(prefix + "/releases/assets/" + item.old.id, {method: "DELETE"}); }
                catch { log("Sicherung bleibt erhalten: " + item.backupName); }
              }
              return {changed: staged.length, unchanged: local.length - staged.length};
            }
            if (phase !== "finalize") throw Error("BONNI_RELEASE_PHASE_INVALID");
            if (!/^[a-f0-9]{40}$/.test(env.SOURCE_COMMIT || "") || !/^sha256:[a-f0-9]{64}$/.test(env.DIGEST || "")) throw Error("BONNI_RELEASE_RESULT_INVALID");
            if (!local.every(file => identical(current.find(asset => asset.name === file.name), file))) throw Error("BONNI_RELEASE_DOWNLOADS_INCOMPLETE");
            const result = {sourceFingerprint: plan.sourceFingerprint, sourceSha256: sha, sourceCommit: env.SOURCE_COMMIT,
              imageDigest: env.DIGEST, assets: local.map(({name, size, digest}) => ({name, size, digest}))};
            const latest = await validate();
            const start = "<!-- bonni-container-summary:start -->", end = "<!-- bonni-container-summary:end -->";
            const cleaned = String(latest.release.body || "").replace(/<!-- bonni-container-summary:start -->[\s\S]*?<!-- bonni-container-summary:end -->/g, "")
              .split("\n").filter(line => !line.startsWith(resultPrefix) && !line.startsWith("<!-- bonni-container-built:")).join("\n").trim();
            const code = "https://github.com/" + repository + "/tree/" + env.SOURCE_COMMIT + "/SYSTEM";
            const downloads = containerBundles(coreVersion, platforms).map(bundle =>
              "- [" + bundle.filename + "](https://github.com/" + repository + "/releases/download/" + encodeURIComponent("v" + coreVersion) + "/" + encodeURIComponent(bundle.filename) + ")").join("\n");
            const qualification = platforms.includes("linux/arm/v7")
              ? "\n\nARMv7: Start/Neustart unter Emulation und ELF-32K-Vorprüfung bestanden. Hardwaretest noch erforderlich." : "";
            const body = cleaned + "\n\n" + start + "\nGeprüfter Container: `" + env.IMAGE + "@" + env.DIGEST
              + "`.\n\nDownload-Pakete (je ein Ordner; eigene Anleitung, sofern hinterlegt):\n" + downloads + qualification + "\n\nPassender Quellcode: [SYSTEM](" + code + ").\n" + end
              + "\n\n<!-- bonni-container-built:" + env.DIGEST + " -->\n" + resultPrefix + JSON.stringify(result) + " -->\n";
            await api(releasePath, {method: "PATCH", json: {name: "Bonni Core v" + coreVersion, body, draft: false}});
            log("Release vollständig aktualisiert: " + release.html_url);
            return result;
          }
          await reconcileContainerRelease();
          
          BONNI_RECONCILE_SCRIPT
          node bonni-release-reconcile.mjs

      - name: Validate selected architectures
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "${PLATFORMS}" in
            linux/amd64|linux/arm64|linux/amd64,linux/arm64|linux/arm/v7|linux/amd64,linux/arm/v7|linux/arm64,linux/arm/v7|linux/amd64,linux/arm64,linux/arm/v7) ;;
            *) echo "Unsupported container architectures" >&2; exit 1 ;;
          esac

      - name: Check out the repository for the matching release code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repository
          fetch-depth: 1

      - name: Download signed Bonni package
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          gh api --method GET             -H "Accept: application/octet-stream"             "/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > bonni-container.zip
          printf '%s  %s\n' "${ASSET_SHA256}" bonni-container.zip | sha256sum --check --strict
          mkdir release
          unzip -q bonni-container.zip -d release
          test -f release/PAYLOAD/SYSTEM/backend/Dockerfile
          test -f release/PAYLOAD/SYSTEM/backend/package.json
          test ! -e release/PAYLOAD/SYSTEM/backend/.env
          if [ -f release/PAYLOAD/SYSTEM/backend/bonni-container-build.json ]; then
            node -e 'const fs = require("node:fs"); const plan = JSON.parse(fs.readFileSync("release/PAYLOAD/SYSTEM/backend/bonni-container-build.json", "utf8")); if (plan.schema !== "bonni.container-build/v1" || !Array.isArray(plan.platforms) || plan.platforms.join(",") !== process.env.PLATFORMS) throw new Error("Container architecture selection differs from the signed package");'
          fi

      - name: Prepare the matching source code commit
        id: bonni_source
        env:
          VERSION: ${{ inputs.version }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
          IMAGE: ${{ inputs.image }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          node --input-type=module <<'BONNI_SOURCE_SCRIPT'
          function canonicalContainerPlatforms(raw) {
            const supported = ["linux/amd64", "linux/arm64", "linux/arm/v7"];
            if (!Array.isArray(raw) || !raw.length || raw.length > supported.length
              || new Set(raw).size !== raw.length || raw.some(p => !supported.includes(p))) {
              throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            }
            return supported.filter(p => raw.includes(p));
          }
          function containerArchitecture(platform) {
            const architecture = {"linux/amd64": "AMD64", "linux/arm64": "ARM64", "linux/arm/v7": "ARMv7"}[platform];
            if (!architecture) throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            return architecture;
          }
          function containerBundles(version, platforms) {
            if (!/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)) throw new Error("CONTAINER_VERSION_INVALID");
            const selected = canonicalContainerPlatforms(platforms);
            const bundles = selected.map(platform => {
              const architecture = containerArchitecture(platform);
              const prefix = platform === "linux/arm/v7" ? "32-Bit" : "64-Bit";
              const folder = `${prefix}-Bonni-Core-v${version}-${architecture}`;
              return {folder, filename: folder + ".zip", platform, architecture,
                variants: [{platform, architecture, subfolder: ""}]};
            });
            // One Raspi package always contains both variants. Never publish a partial
            // Raspi ZIP when only one of its required architectures was built.
            if (selected.includes("linux/arm64") && selected.includes("linux/arm/v7")) {
              const folder = `Raspi-Bonni-Core-v${version}`;
              bundles.push({folder, filename: folder + ".zip", variants: [
                {platform: "linux/arm/v7", architecture: "ARMv7", subfolder: "32-Bit-ARMv7"},
                {platform: "linux/arm64", architecture: "ARM64", subfolder: "64-Bit-ARM64"},
              ]});
            }
            return bundles;
          }
          function containerDownloadNames(version, platforms) {
            const files = canonicalContainerPlatforms(platforms).flatMap(platform => {
              const base = `Bonni-Core-v${version}-${containerArchitecture(platform)}`;
              return [".yml", ".yml.sha256", "-Offline.yml", "-Offline.yml.sha256", ".tar", ".tar.sha256", "-Datenbank.tar", "-Datenbank.tar.sha256"].map(suffix => base + suffix);
            });
            return files.concat(containerBundles(version, platforms).flatMap(b => [b.filename, b.filename + ".sha256"]));
          }
          import fs from "node:fs/promises";
          import path from "node:path";
          import {spawnSync} from "node:child_process";
          
          const repositoryRoot = path.resolve(process.env.BONNI_REPOSITORY_ROOT || "repository");
          const systemRoot = path.resolve(process.env.BONNI_SYSTEM_ROOT || "release/PAYLOAD/SYSTEM");
          const version = process.env.VERSION || "";
          const sourceSha256 = process.env.ASSET_SHA256 || "";
          const platforms = (process.env.PLATFORMS || "").split(",");
          if (!/^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[a-z])?$/.test(version)
              || !/^[a-f0-9]{64}$/.test(sourceSha256)
              || canonicalContainerPlatforms(platforms).join(",") !== platforms.join(",")) {
            throw new Error("GITHUB_CONTAINER_SOURCE_INPUT_INVALID");
          }
          const coreVersion = version.replace(/-([a-z])$/, "+$1");
          if (!(await fs.lstat(systemRoot)).isDirectory() || (await fs.lstat(systemRoot)).isSymbolicLink()) {
            throw new Error("GITHUB_CONTAINER_SOURCE_UNSAFE");
          }
          const gitEnvironment = {...process.env,
            GIT_AUTHOR_NAME: "github-actions[bot]", GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com",
            GIT_COMMITTER_NAME: "github-actions[bot]", GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"};
          function git(args, input = undefined) {
            const result = spawnSync("git", ["-C", repositoryRoot, ...args], {input, env: gitEnvironment, maxBuffer: 8 * 1024 * 1024});
            if (result.error || result.status !== 0) throw new Error("GITHUB_CONTAINER_SOURCE_GIT_FAILED");
            return result.stdout.toString("utf8");
          }
          const baseCommit = git(["rev-parse", "HEAD"]).trim();
          let files = 0;
          async function sourceTree(directory, prefix = "") {
            const entries = [];
            const names = (await fs.readdir(directory)).sort((a, b) => Buffer.compare(Buffer.from(a), Buffer.from(b)));
            for (const name of names) {
              const relative = prefix + name;
              if (/[\u0000-\u001f\u007f\\]/.test(name) ||
                  /^(?:tests?|__tests__|__mocks__|fixtures|node_modules|coverage|\.git)$/i.test(name) ||
                  (name.startsWith(".env") && relative !== "backend/.env.example") ||
                  /^(?:\.git-credentials|\.netrc|\.npmrc|\.pypirc|credentials?(?:\.json)?|secrets?(?:\.json)?|id_(?:rsa|ed25519)|private[._-]?key(?:\.pem)?)$/i.test(name) ||
                  /\.(?:test|spec)\.[cm]?[jt]sx?$/i.test(name) || /\.bonni$/i.test(name)) {
                throw new Error("GITHUB_CONTAINER_SOURCE_PRIVATE_FILE");
              }
              const file = path.join(directory, name);
              const info = await fs.lstat(file);
              if (info.isSymbolicLink()) throw new Error("GITHUB_CONTAINER_SOURCE_UNSAFE");
              if (info.isDirectory()) {
                entries.push("040000 tree " + await sourceTree(file, relative + "/") + "\t" + name);
              } else if (info.isFile() && info.nlink === 1) {
                if (++files > 10000) throw new Error("GITHUB_CONTAINER_SOURCE_TOO_LARGE");
                const bytes = await fs.readFile(file);
                if (relative === "backend/package.json" || relative === "frontend/package.json") {
                  if (JSON.parse(bytes.toString("utf8")).version !== coreVersion) throw new Error("GITHUB_CONTAINER_SOURCE_VERSION_MISMATCH");
                }
                // Raw blobs keep the exact signed bytes, even with CRLF or Git filters.
                const blob = git(["hash-object", "-w", "--no-filters", "--stdin"], bytes).trim();
                entries.push((info.mode & 0o111 ? "100755" : "100644") + " blob " + blob + "\t" + name);
              } else { throw new Error("GITHUB_CONTAINER_SOURCE_UNSAFE"); }
            }
            return git(["mktree", "-z"], Buffer.from(entries.join("\0") + (entries.length ? "\0" : ""))).trim();
          }
          for (const part of ["backend", "frontend"]) {
            const file = path.join(systemRoot, part, "package.json");
            if (!(await fs.lstat(file)).isFile()) throw new Error("GITHUB_CONTAINER_SOURCE_PACKAGE_MISSING");
          }
          const systemTree = await sourceTree(systemRoot);
          const receipt = Buffer.from(JSON.stringify({schema: "bonni.container-source/v1", version: coreVersion,
            image: (process.env.IMAGE || "") + ":" + version, sourcePackageSha256: sourceSha256, platforms}, null, 2) + "\n");
          const receiptBlob = git(["hash-object", "-w", "--no-filters", "--stdin"], receipt).trim();
          const rootEntries = git(["ls-tree", "-z", baseCommit]).split("\0").filter(Boolean)
            .filter(entry => !["SYSTEM", "BONNI-CONTAINER-RELEASE.json"].includes(entry.slice(entry.indexOf("\t") + 1)));
          rootEntries.push("040000 tree " + systemTree + "\tSYSTEM", "100644 blob " + receiptBlob + "\tBONNI-CONTAINER-RELEASE.json");
          const tree = git(["mktree", "-z"], Buffer.from(rootEntries.join("\0") + "\0")).trim();
          const previousTree = git(["rev-parse", baseCommit + "^{tree}"]).trim();
          const commit = tree === previousTree ? baseCommit : git(["commit-tree", tree, "-p", baseCommit],
            Buffer.from("Release Bonni Core " + coreVersion + "\n\nSigned source package SHA-256: " + sourceSha256 + "\n")).trim();
          if (!/^[a-f0-9]{40}$/.test(commit)) throw new Error("GITHUB_CONTAINER_SOURCE_COMMIT_INVALID");
          if (process.env.GITHUB_OUTPUT) await fs.appendFile(process.env.GITHUB_OUTPUT, "source_commit=" + commit + "\nbase_commit=" + baseCommit + "\n");
          console.log(JSON.stringify({sourceCommit: commit, baseCommit, systemTree, files}));
          
          BONNI_SOURCE_SCRIPT

      - name: Enable emulation
        uses: docker/setup-qemu-action@v3

      - name: Prepare Docker Buildx
        id: bonni_builder
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build ARMv7 PostgreSQL with 32K-compatible alignment
        id: bonni_database
        if: contains(inputs.platforms, 'linux/arm/v7')
        uses: docker/build-push-action@v6
        with:
          context: release/PAYLOAD
          file: release/PAYLOAD/SYSTEM/backend/Dockerfile.armv7-db
          platforms: linux/arm/v7
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.bonni_source.outputs.source_commit }}
            io.bonni.source-package.sha256=${{ inputs.asset_sha256 }}
          tags: |
            ${{ inputs.image }}-database:build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build and publish the finished container
        id: bonni_image
        uses: docker/build-push-action@v6
        with:
          context: release/PAYLOAD
          file: release/PAYLOAD/SYSTEM/backend/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            BONNI_CORE_REVISION=${{ steps.bonni_source.outputs.source_commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.bonni_source.outputs.source_commit }}
            org.opencontainers.image.version=${{ inputs.version }}
            io.bonni.source-package.sha256=${{ inputs.asset_sha256 }}
          tags: |
            ${{ inputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create versioned Compose files pinned to platform images
        env:
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.bonni_image.outputs.digest }}
          DATABASE_ARMV7_IMAGE: ${{ inputs.image }}-database@${{ steps.bonni_database.outputs.digest }}
          DATABASE_IMAGE: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > core-image-index.json
          docker buildx imagetools inspect "${DATABASE_IMAGE}" --raw > postgres-image-index.json
          if [[ ",${PLATFORMS}," == *",linux/arm/v7,"* ]]; then
            docker buildx imagetools inspect "${DATABASE_ARMV7_IMAGE}" --raw > postgres-armv7-index.json
          fi
          node --input-type=module <<'BONNI_COMPOSE_SCRIPT'
          import fs from "node:fs/promises";
          import {randomBytes,createHash} from "node:crypto";
          function canonicalContainerPlatforms(raw) {
            const supported = ["linux/amd64", "linux/arm64", "linux/arm/v7"];
            if (!Array.isArray(raw) || !raw.length || raw.length > supported.length
              || new Set(raw).size !== raw.length || raw.some(p => !supported.includes(p))) {
              throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            }
            return supported.filter(p => raw.includes(p));
          }
          function containerArchitecture(platform) {
            const architecture = {"linux/amd64": "AMD64", "linux/arm64": "ARM64", "linux/arm/v7": "ARMv7"}[platform];
            if (!architecture) throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            return architecture;
          }
          function containerBundles(version, platforms) {
            if (!/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)) throw new Error("CONTAINER_VERSION_INVALID");
            const selected = canonicalContainerPlatforms(platforms);
            const bundles = selected.map(platform => {
              const architecture = containerArchitecture(platform);
              const prefix = platform === "linux/arm/v7" ? "32-Bit" : "64-Bit";
              const folder = `${prefix}-Bonni-Core-v${version}-${architecture}`;
              return {folder, filename: folder + ".zip", platform, architecture,
                variants: [{platform, architecture, subfolder: ""}]};
            });
            // One Raspi package always contains both variants. Never publish a partial
            // Raspi ZIP when only one of its required architectures was built.
            if (selected.includes("linux/arm64") && selected.includes("linux/arm/v7")) {
              const folder = `Raspi-Bonni-Core-v${version}`;
              bundles.push({folder, filename: folder + ".zip", variants: [
                {platform: "linux/arm/v7", architecture: "ARMv7", subfolder: "32-Bit-ARMv7"},
                {platform: "linux/arm64", architecture: "ARM64", subfolder: "64-Bit-ARM64"},
              ]});
            }
            return bundles;
          }
          function containerDownloadNames(version, platforms) {
            const files = canonicalContainerPlatforms(platforms).flatMap(platform => {
              const base = `Bonni-Core-v${version}-${containerArchitecture(platform)}`;
              return [".yml", ".yml.sha256", "-Offline.yml", "-Offline.yml.sha256", ".tar", ".tar.sha256", "-Datenbank.tar", "-Datenbank.tar.sha256"].map(suffix => base + suffix);
            });
            return files.concat(containerBundles(version, platforms).flatMap(b => [b.filename, b.filename + ".sha256"]));
          }
          function buildContainerCompose({ version, platform, image, databaseImage }) {
            // Verified children of the existing, unchanged PostgreSQL 16 image index.
            databaseImage ??= {
              "linux/amd64": "postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382",
              "linux/arm64": "postgres:16-alpine@sha256:7ae1143a9f249af815f056751a122a86d7e44ddce0926f2b227e3d5c434444f4",
            }[platform];
            if (!/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)
              || !["linux/amd64", "linux/arm64", "linux/arm/v7"].includes(platform)
              || !/^[a-z0-9][a-z0-9._:/@-]{1,255}$/.test(image)
              || !(platform === "linux/arm/v7"
                ? /^[a-z0-9][a-z0-9._:/@-]{1,255}$/.test(databaseImage || "")
                : /^postgres(?::[a-z0-9._-]+)?@sha256:[a-f0-9]{64}$/.test(databaseImage || ""))) {
              throw new Error("CONTAINER_COMPOSE_INPUT_INVALID");
            }
            return `# Bonni Core v${version} – ${containerArchitecture(platform)}
          # Docker Compose: passende Architektur wählen und diese YAML verwenden.
          # Vor dem Start die DREI BITTE-Werte unten durch eigene Werte ersetzen.
          # DB-Kennwort: mindestens 24 Zeichen. MASTER_KEY: mindestens 43 Zeichen.
          # Admin: mindestens 16 Zeichen, Groß-/Kleinbuchstaben, Zahl und Sonderzeichen.
          # Für Passwörter kein Dollarzeichen verwenden (Compose-Interpolation).
          # Anwendung immer gleich benennen: bonni-core. Daten-Volumes behalten!
          # Einzelbetrieb: Core + PostgreSQL. Der externe Update-/Notlauf-Stack ist separat.
          
          x-bonni-environment: &bonni_environment
            POSTGRES_PASSWORD: &db_password "BITTE_EIGENES_DATENBANKKENNWORT_EINTRAGEN"
            MASTER_KEY: "BITTE_EIGENEN_ZUFAELLIGEN_MASTER_KEY_EINTRAGEN"
            BONNI_BOOTSTRAP_ADMIN_PASSWORD: "BITTE_EIGENES_ADMIN_KENNWORT_EINTRAGEN"
            BONNI_BOOTSTRAP_FIRST_INSTALL_ONLY: "true"
            NODE_ENV: production
            PORT: "4000"
            LOCAL_AUTH_BIND: 0.0.0.0
            LOCAL_AUTH_PORT: "4001"
            SYSTEM_VERSION: "${version.replace(/-([a-z])$/, "+$1")}"
            SYSTEM_SLOT_ROLE: active
            SYSTEM_SLOT_NAME: backend-single
            AUTH_MODE: LOCAL
            DATABASE_OPERATION_MODE: server-only
            BONNI_PROJECT_ROOT: /app
            RUN_SYSTEM_ROOT: /app/run_system
            BONNI_STORAGE_ROOT: /app/storage
            MEDIA_STORAGE_ROOT: /app/storage/media
            FRONTEND_DIST_ROOT: /app/public
            TZ: Europe/Berlin
          
          services:
            db:
              image: ${databaseImage}
              platform: ${platform}
              restart: unless-stopped
              environment:
                POSTGRES_USER: bonni
                POSTGRES_DB: bonni_core
                POSTGRES_PASSWORD: *db_password
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U bonni -d bonni_core"]
                interval: 5s
                timeout: 5s
                retries: 30
              networks: [database]
          
            bonni-core:
              image: ${image}
              platform: ${platform}
              init: true
              restart: unless-stopped
              depends_on:
                db:
                  condition: service_healthy
              environment: *bonni_environment
              command:
                - /bin/sh
                - -ec
                - |
                  export DATABASE_URL="$$(node -e 'const e=process.env; for (const [k,n] of [["POSTGRES_PASSWORD",24],["MASTER_KEY",43],["BONNI_BOOTSTRAP_ADMIN_PASSWORD",16]]) { if (!e[k] || e[k].length<n || /BITTE_|change.?me|example|placeholder/i.test(e[k])) throw Error("Bitte eigenen Wert setzen: "+k); } process.stdout.write("postgresql://bonni:"+encodeURIComponent(e.POSTGRES_PASSWORD)+"@db:5432/bonni_core?schema=public");')"
                  test -n "$$DATABASE_URL"
                  export SERVER_DATABASE_URL="$$DATABASE_URL"
                  node scripts/runtime/bootstrap-production-database.mjs
                  npm run backup:restore-pending
                  exec npm run start
              ports:
                - "4000:4000"
              volumes:
                - core_update:/app/UPDATE
                - core_storage:/app/storage
                - run_system:/app/run_system
                - core_logs:/app/backend/archives/logs
                - core_apps:/app/app
                - core_addons:/app/addons
                - core_plugins:/app/plugins
                - core_bridges:/app/bridges
              healthcheck:
                test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
                interval: 10s
                timeout: 5s
                retries: 18
                start_period: 90s
              stop_grace_period: 30s
              security_opt: ["no-new-privileges:true"]
              networks: [database, frontend]
          
          volumes:
            postgres_data:
            core_update:
            core_storage:
            run_system:
            core_logs:
            core_apps:
            core_addons:
            core_plugins:
            core_bridges:
          
          networks:
            database:
              internal: true
            frontend:
          `;
          }
          function composeFilename(version, platform) {
            // Reuse validation so filenames cannot escape the output directory.
            if (!/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)) throw new Error("CONTAINER_COMPOSE_INPUT_INVALID");
            return `Bonni-Core-v${version}-${containerArchitecture(platform)}.yml`;
          }
          function resolvePlatformImage(image, index, platform) {
            if (!/^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$/.test(image)
              || !["linux/amd64", "linux/arm64", "linux/arm/v7"].includes(platform)
              || index?.schemaVersion !== 2 || !Array.isArray(index.manifests)) {
              throw new Error("CONTAINER_IMAGE_INDEX_INVALID");
            }
            const [os, architecture, variant] = platform.split("/");
            const matches = index.manifests.filter(entry => entry.platform?.os === os
              && entry.platform?.architecture === architecture
              && (variant ? entry.platform.variant === variant : (!entry.platform.variant || (architecture === "arm64" && entry.platform.variant === "v8")))
              && entry.annotations?.["vnd.docker.reference.type"] !== "attestation-manifest");
            if (matches.length !== 1 || !/^sha256:[a-f0-9]{64}$/.test(matches[0].digest || "")
              || !["application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"].includes(matches[0].mediaType)) {
              throw new Error("CONTAINER_PLATFORM_MANIFEST_MISSING_OR_AMBIGUOUS: " + platform);
            }
            return image.split("@")[0] + "@" + matches[0].digest;
          }
          function localContainerImageTag(reference, version, platform, database = false) {
            if (!/^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$/.test(reference)
              || !/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)
              || !['linux/amd64', 'linux/arm64', 'linux/arm/v7'].includes(platform)) throw Error('BONNI_EXPORT_REFERENCE_INVALID');
            const arch = platform === 'linux/arm/v7' ? 'armv7' : platform.split('/')[1];
            return `bonni-core${database ? '-database' : ''}:${version.replace('+', '-')}-${arch}-${reference.split('sha256:')[1]}`;
          }
          const version = process.env.VERSION.replace(/-([a-z])$/, "+$1");
          const platforms = process.env.PLATFORMS.split(",");
          if (!/^sha256:[a-f0-9]{64}$/.test(process.env.DIGEST)) throw Error("CONTAINER_IMAGE_DIGEST_INVALID");
          const coreIndex = JSON.parse(await fs.readFile("core-image-index.json", "utf8"));
          const databaseIndex = JSON.parse(await fs.readFile("postgres-image-index.json", "utf8"));
          await fs.mkdir("compose-assets", {recursive: true});
          await fs.mkdir("smoke", {recursive: true, mode: 0o700});
          const exportPlan = [];
          for (const platform of platforms) {
            const image = resolvePlatformImage(process.env.IMAGE + "@" + process.env.DIGEST, coreIndex, platform);
            const databaseImage = platform === "linux/arm/v7"
              ? resolvePlatformImage(process.env.DATABASE_ARMV7_IMAGE, JSON.parse(await fs.readFile("postgres-armv7-index.json", "utf8")), platform)
              : resolvePlatformImage(process.env.DATABASE_IMAGE, databaseIndex, platform);
            const text = buildContainerCompose({version, platform, image, databaseImage});
            const filename = composeFilename(version, platform);
            await fs.writeFile("compose-assets/" + filename, text);
            await fs.writeFile("compose-assets/" + filename + ".sha256", createHash("sha256").update(text).digest("hex") + "  " + filename + "\n");
            const smoke = text.replace("BITTE_EIGENES_DATENBANKKENNWORT_EINTRAGEN", randomBytes(32).toString("hex"))
              .replace("BITTE_EIGENEN_ZUFAELLIGEN_MASTER_KEY_EINTRAGEN", randomBytes(32).toString("hex"))
              .replace("BITTE_EIGENES_ADMIN_KENNWORT_EINTRAGEN", "A7!" + randomBytes(24).toString("hex"))
              .replace('"4000:4000"', '"127.0.0.1::4000"');
            await fs.writeFile("smoke/" + containerArchitecture(platform).toLowerCase() + ".yml", smoke, {mode: 0o600});
            const localImage = localContainerImageTag(image, version, platform);
            const localDatabase = localContainerImageTag(databaseImage, version, platform, true);
            const offline = source => source.replace('image: ' + image, 'image: ' + localImage + '\n    pull_policy: never')
              .replace('image: ' + databaseImage, 'image: ' + localDatabase + '\n    pull_policy: never');
            const offlineFilename = filename.replace(/\.yml$/, '-Offline.yml');
            const offlineText = '# Offline: zuerst Core-TAR und Datenbank-TAR unter Images importieren.\n' + offline(text);
            await fs.writeFile('compose-assets/' + offlineFilename, offlineText);
            await fs.writeFile('compose-assets/' + offlineFilename + '.sha256', createHash('sha256').update(offlineText).digest('hex') + '  ' + offlineFilename + '\n');
            await fs.writeFile('smoke/' + containerArchitecture(platform).toLowerCase() + '-offline.yml', offline(smoke), {mode:0o600});
            exportPlan.push({platform, images:[
              {service:'bonni-core',reference:image,tag:localImage,file:filename.replace(/\.yml$/, '.tar')},
              {service:'db',reference:databaseImage,tag:localDatabase,file:filename.replace(/\.yml$/, '-Datenbank.tar')},
            ]});
          }
          await fs.writeFile("export-plan.json", JSON.stringify(exportPlan));
          await fs.writeFile("bundle-plan.json", JSON.stringify(containerBundles(version, platforms)));
          
          BONNI_COMPOSE_SCRIPT

      - name: Start and restart the Compose application for every architecture
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          for PLATFORM in ${PLATFORMS//,/ }; do
            echo "Checking container startup and restart: ${PLATFORM}"
            ARCH=${PLATFORM#linux/}
            if [ "${PLATFORM}" = linux/arm/v7 ]; then ARCH=armv7; fi
            PROJECT="bonni-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
            FILE="smoke/${ARCH}.yml"
            trap 'docker compose -p "$PROJECT" -f "$FILE" down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT
            docker compose -p "$PROJECT" -f "$FILE" config --quiet
            docker compose -p "$PROJECT" -f "$FILE" pull
            while IFS= read -r TEST_IMAGE; do
              DETECTED=$(docker image inspect --format '{{.Os}}/{{.Architecture}}{{if eq .Architecture "arm"}}/{{.Variant}}{{end}}' "$TEST_IMAGE")
              if [ "${DETECTED}" != "${PLATFORM}" ]; then
                echo "Image architecture mismatch: ${DETECTED}, expected ${PLATFORM}" >&2
                exit 1
              fi
            done < <(docker compose -p "$PROJECT" -f "$FILE" config --images)
            if ! docker compose -p "$PROJECT" -f "$FILE" up -d --wait --wait-timeout 600; then
              docker compose -p "$PROJECT" -f "$FILE" logs --tail 100
              exit 1
            fi
            docker compose -p "$PROJECT" -f "$FILE" exec -T bonni-core node -e "fetch('http://127.0.0.1:4000/').then(async r=>{if(!r.ok || !(await r.text()).includes('<html')) process.exit(1)}).catch(()=>process.exit(1))"
            docker compose -p "$PROJECT" -f "$FILE" restart bonni-core
            docker compose -p "$PROJECT" -f "$FILE" up -d --wait --wait-timeout 600
            docker compose -p "$PROJECT" -f "$FILE" down --volumes --remove-orphans
            trap - EXIT
          done

      - name: Check ARMv7 ELF files for 32K page alignment
        if: contains(inputs.platforms, 'linux/arm/v7')
        run: |
          set -euo pipefail
          cat > bonni-elf-check.py <<'BONNI_ELF_CHECK'
          import sys, struct, tarfile, json
          page = 32768
          checked = 0
          failures = []
          with tarfile.open(sys.argv[1], 'r|*') as archive:
              for member in archive:
                  if not member.isfile() or member.size < 52:
                      continue
                  stream = archive.extractfile(member)
                  header = stream.read(52)
                  if header[:4] != b'\x7fELF':
                      continue
                  if header[4:6] != b'\x01\x01':
                      failures.append(member.name + ': not little-endian ELF32')
                      continue
                  kind, machine = struct.unpack_from('<HH', header, 16)
                  if kind not in (2, 3):
                      continue
                  if machine != 40:
                      failures.append(member.name + ': not ARM')
                      continue
                  phoff = struct.unpack_from('<I', header, 28)[0]
                  phsize, count = struct.unpack_from('<HH', header, 42)
                  end = phoff + phsize * count
                  if phoff < 52 or phsize < 32 or end > min(member.size, 1048576):
                      failures.append(member.name + ': invalid ELF program headers')
                      continue
                  data = header + stream.read(end - 52)
                  if len(data) != end:
                      failures.append(member.name + ': truncated ELF')
                      continue
                  checked += 1
                  for i in range(count):
                      p = struct.unpack_from('<IIIIIIII', data, phoff + i * phsize)
                      if p[0] == 1 and (p[7] < page or (p[1] - p[2]) % page):
                          failures.append(member.name + ': PT_LOAD incompatible with 32K alignment')
                          break
          print(json.dumps({'check':'ARMv7 ELF 32K structural precheck', 'checked':checked, 'failures':failures}, indent=2))
          if not checked or failures:
              sys.exit(1)
          
          BONNI_ELF_CHECK
          while IFS= read -r TEST_IMAGE; do
            CID=$(docker create --platform linux/arm/v7 "$TEST_IMAGE")
            trap 'docker rm -f "$CID" >/dev/null 2>&1 || true; rm -f armv7-rootfs.tar' EXIT
            docker export "$CID" -o armv7-rootfs.tar
            python3 bonni-elf-check.py armv7-rootfs.tar
            docker rm "$CID"
            rm -f armv7-rootfs.tar
            trap - EXIT
          done < <(docker compose -f smoke/armv7.yml config --images)
          echo 'ARMv7: start/restart and ELF 32K precheck passed. Hardware test remains required.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Export and verify the tested Core and database images
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.bonni_source.outputs.source_commit }}
          SOURCE_SHA256: ${{ inputs.asset_sha256 }}
        run: |
          set -euo pipefail
          cat > verify-image-archive.py <<'BONNI_ARCHIVE_CHECK'
          import hashlib, json, pathlib, re, sys, tarfile
          filename, tag, expected_id, expected_platform = sys.argv[1:]
          with tarfile.open(filename, 'r:') as archive:
              members = archive.getmembers()
              names = [m.name for m in members]
              if len(set(names)) != len(names) or any(m.issym() or m.islnk() or m.name.startswith('/') or '..' in pathlib.PurePosixPath(m.name).parts for m in members):
                  raise ValueError('BONNI_ARCHIVE_UNSAFE')
              def read_json(name):
                  member = archive.getmember(name)
                  if not member.isfile() or member.size > 16*1024*1024:
                      raise ValueError('BONNI_ARCHIVE_JSON_INVALID')
                  data = archive.extractfile(member).read()
                  return data, json.loads(data)
              _, manifest = read_json('manifest.json')
              if not isinstance(manifest, list) or len(manifest) != 1 or manifest[0].get('RepoTags') != [tag]:
                  raise ValueError('BONNI_ARCHIVE_TAG_INVALID')
              entry = manifest[0]
              data, config = read_json(entry['Config'])
              if 'sha256:' + hashlib.sha256(data).hexdigest() != expected_id:
                  raise ValueError('BONNI_ARCHIVE_CONFIG_MISMATCH')
              platform = config['os'] + '/' + config['architecture'] + ('/' + config.get('variant','') if config['architecture'] == 'arm' else '')
              if platform != expected_platform:
                  raise ValueError('BONNI_ARCHIVE_PLATFORM_MISMATCH')
              layers = entry['Layers']
              digests = config['rootfs']['diff_ids']
              if not layers or len(layers) != len(digests):
                  raise ValueError('BONNI_ARCHIVE_LAYERS_INVALID')
              for name, digest in zip(layers, digests):
                  member = archive.getmember(name)
                  if not member.isfile():
                      raise ValueError('BONNI_ARCHIVE_LAYER_INVALID')
                  with archive.extractfile(member) as source:
                      if 'sha256:' + hashlib.file_digest(source, 'sha256').hexdigest() != digest:
                          raise ValueError('BONNI_ARCHIVE_LAYER_MISMATCH')
          print('Verified Docker image archive: ' + pathlib.Path(filename).name)
          
          BONNI_ARCHIVE_CHECK
          node --input-type=module <<'BONNI_EXPORT_SCRIPT'
          import fs from "node:fs";
          import {execFileSync} from "node:child_process";
          import {createHash} from "node:crypto";
          function localContainerImageTag(reference, version, platform, database = false) {
            if (!/^[a-z0-9][a-z0-9._:/-]*@sha256:[a-f0-9]{64}$/.test(reference)
              || !/^\d+\.\d+\.\d+(?:[+-][a-z])?$/.test(version)
              || !['linux/amd64', 'linux/arm64', 'linux/arm/v7'].includes(platform)) throw Error('BONNI_EXPORT_REFERENCE_INVALID');
            const arch = platform === 'linux/arm/v7' ? 'armv7' : platform.split('/')[1];
            return `bonni-core${database ? '-database' : ''}:${version.replace('+', '-')}-${arch}-${reference.split('sha256:')[1]}`;
          }
          
          const docker = (...args) => execFileSync('docker', args, {encoding:'utf8', maxBuffer:16*1024*1024});
          const plans = JSON.parse(fs.readFileSync('export-plan.json','utf8'));
          for (const plan of plans) {
            for (const item of plan.images) {
              if (item.tag !== localContainerImageTag(item.reference, process.env.VERSION, plan.platform, item.service === 'db')
                || !/^Bonni-Core-v\d+\.\d+\.\d+(?:[+-][a-z])?-(AMD64|ARM64|ARMv7)(?:-Datenbank)?\.tar$/.test(item.file)) throw Error('BONNI_EXPORT_PLAN_INVALID');
              const details = JSON.parse(docker('image','inspect',item.reference));
              if (details.length !== 1) throw Error('BONNI_EXPORT_IMAGE_AMBIGUOUS');
              const config = details[0];
              const platform = config.Os + '/' + config.Architecture + (config.Architecture === 'arm' ? '/' + config.Variant : '');
              if (platform !== plan.platform || !/^sha256:[a-f0-9]{64}$/.test(config.Id)) throw Error('BONNI_EXPORT_PLATFORM_INVALID');
              if (item.service === 'bonni-core') {
                const labels = config.Config?.Labels || {};
                if (labels['org.opencontainers.image.revision'] !== process.env.SOURCE_COMMIT
                  || labels['io.bonni.source-package.sha256'] !== process.env.SOURCE_SHA256
                  || labels['org.opencontainers.image.version'] !== process.env.VERSION) throw Error('BONNI_EXPORT_SOURCE_MISMATCH');
              }
              docker('image','tag',config.Id,item.tag);
              const file = 'compose-assets/' + item.file;
              docker('image','save','--output',file,item.tag);
              execFileSync('python3',['verify-image-archive.py',file,item.tag,config.Id,plan.platform],{stdio:'inherit'});
              docker('image','rm',item.tag);
              docker('image','load','--input',file);
              if (docker('image','inspect','--format','{{.Id}}',item.tag).trim() !== config.Id) throw Error('BONNI_EXPORT_ROUNDTRIP_MISMATCH');
              const hash = createHash('sha256');
              for await (const chunk of fs.createReadStream(file)) hash.update(chunk);
              fs.writeFileSync(file+'.sha256',hash.digest('hex')+'  '+item.file+'\n');
            }
          }
          
          BONNI_EXPORT_SCRIPT

      - name: Start and restart the application from imported TAR images without pulling
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          for PLATFORM in ${PLATFORMS//,/ }; do
            ARCH=${PLATFORM#linux/}
            if [ "$PLATFORM" = linux/arm/v7 ]; then ARCH=armv7; fi
            PROJECT="bonni-offline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
            FILE="smoke/${ARCH}-offline.yml"
            trap 'docker compose -p "$PROJECT" -f "$FILE" down --volumes --remove-orphans >/dev/null 2>&1 || true' EXIT
            docker compose -p "$PROJECT" -f "$FILE" config --quiet
            if ! docker compose -p "$PROJECT" -f "$FILE" up -d --pull never --wait --wait-timeout 600; then
              docker compose -p "$PROJECT" -f "$FILE" logs --tail 100
              exit 1
            fi
            docker compose -p "$PROJECT" -f "$FILE" exec -T bonni-core node -e "fetch('http://127.0.0.1:4000/').then(async r=>{if(!r.ok || !(await r.text()).includes('<html')) process.exit(1)}).catch(()=>process.exit(1))"
            docker compose -p "$PROJECT" -f "$FILE" restart bonni-core
            docker compose -p "$PROJECT" -f "$FILE" up -d --pull never --wait --wait-timeout 600
            docker compose -p "$PROJECT" -f "$FILE" down --volumes --remove-orphans
            trap - EXIT
          done

      - name: Bundle downloads into separate architecture folders
        run: |
          set -euo pipefail
          python3 - <<'BONNI_BUNDLES'
          import hashlib, json, os, pathlib, re, shutil, zipfile
          root = pathlib.Path('compose-assets')
          instruction_file = pathlib.Path('release/PAYLOAD/SYSTEM/backend/deploy/bonni-container-instructions.json')
          instructions = {}
          if instruction_file.is_symlink():
              raise ValueError('BONNI_INSTRUCTIONS_INPUT_INVALID')
          if instruction_file.exists():
              if not instruction_file.is_file() or instruction_file.stat().st_size > 2097152:
                  raise ValueError('BONNI_INSTRUCTIONS_INPUT_INVALID')
              document = json.loads(instruction_file.read_text(encoding='utf-8'))
              if not isinstance(document, dict) or set(document) != {'schema','instructions'} or document['schema'] != 'bonni.container-instructions/v1':
                  raise ValueError('BONNI_INSTRUCTIONS_SCHEMA_INVALID')
              instructions = document['instructions']
              if not isinstance(instructions, dict) or set(instructions) - {'armv7','amd64','arm64','raspi'}:
                  raise ValueError('BONNI_INSTRUCTIONS_INVALID')
              for key, text in instructions.items():
                  if not isinstance(text, str) or len(text.encode('utf-8')) > 65536 or re.search(r'[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]', text):
                      raise ValueError('BONNI_INSTRUCTIONS_TEXT_INVALID: ' + key)
          plans = json.loads(pathlib.Path('bundle-plan.json').read_text())
          if not isinstance(plans, list) or not 1 <= len(plans) <= 4:
              raise ValueError('BONNI_BUNDLE_PLAN_INVALID')
          def digest(path):
              with open(path, 'rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()
          seen = set()
          for plan in plans:
              folder, filename = plan['folder'], plan['filename']
              match = re.fullmatch(r'(32-Bit|64-Bit)-Bonni-Core-v(\d+\.\d+\.\d+(?:[+-][a-z])?)-(AMD64|ARM64|ARMv7)', folder)
              raspi = re.fullmatch(r'Raspi-Bonni-Core-v(\d+\.\d+\.\d+(?:[+-][a-z])?)', folder)
              if not (match or raspi) or filename != folder + '.zip' or filename in seen:
                  raise ValueError('BONNI_BUNDLE_NAME_INVALID')
              seen.add(filename)
              if raspi:
                  version = raspi.group(1)
                  variants = [
                      {'platform':'linux/arm/v7','architecture':'ARMv7','subfolder':'32-Bit-ARMv7'},
                      {'platform':'linux/arm64','architecture':'ARM64','subfolder':'64-Bit-ARM64'},
                  ]
              else:
                  prefix, version, arch = match.groups()
                  platform = {'AMD64':'linux/amd64','ARM64':'linux/arm64','ARMv7':'linux/arm/v7'}[arch]
                  if plan.get('architecture') != arch or plan.get('platform') != platform or prefix != ('32-Bit' if arch == 'ARMv7' else '64-Bit'):
                      raise ValueError('BONNI_BUNDLE_PLATFORM_INVALID')
                  variants = [{'platform':platform,'architecture':arch,'subfolder':''}]
              if plan.get('variants') != variants:
                  raise ValueError('BONNI_BUNDLE_PLATFORM_INVALID')
              instruction_key = 'raspi' if raspi else arch.lower()
              instruction_text = instructions.get(instruction_key, '')
              instruction_member = folder + '/Anleitung.txt'
              members = []
              for variant in variants:
                  stem = 'Bonni-Core-v' + version + '-' + variant['architecture']
                  names = [stem + suffix for suffix in ('.yml', '.yml.sha256', '-Offline.yml', '-Offline.yml.sha256', '.tar', '.tar.sha256', '-Datenbank.tar', '-Datenbank.tar.sha256')]
                  directory = folder + '/' + (variant['subfolder'] + '/' if variant['subfolder'] else '')
                  for name in names:
                      path = root / name
                      if path.is_symlink() or not path.is_file() or path.stat().st_size == 0:
                          raise ValueError('BONNI_BUNDLE_INPUT_INVALID: ' + name)
                      members.append((name, directory + name))
                  for ext in ('.yml', '-Offline.yml', '.tar', '-Datenbank.tar'):
                      name = stem + ext
                      expected = digest(root / name) + '  ' + name + '\n'
                      if (root / (name + '.sha256')).read_text() != expected:
                          raise ValueError('BONNI_BUNDLE_CHECKSUM_MISMATCH: ' + name)
              # Only explicit, documented placeholders are expanded, once. No code evaluation.
              paths = lambda suffix: '\n'.join((v['subfolder'] + '/' if v['subfolder'] else '') + 'Bonni-Core-v' + version + '-' + v['architecture'] + suffix for v in variants)
              tokens = {
                  'VERSION': version, 'PAKETNAME': filename,
                  'ARCHITEKTUR': 'ARMv7 (32 Bit) und ARM64 (64 Bit)' if raspi else arch,
                  'YAML_DATEI': paths('.yml'), 'OFFLINE_YAML_DATEI': paths('-Offline.yml'),
                  'TAR_DATEI': paths('.tar'), 'DATENBANK_TAR_DATEI': paths('-Datenbank.tar'),
                  'DATEIEN': '\n'.join(member[len(folder)+1:] for name, member in members),
              }
              instruction_text = re.sub(r'\{\{([A-Z_]+)\}\}', lambda m: tokens.get(m.group(1), m.group(0)), instruction_text)
              instruction_bytes = instruction_text.encode('utf-8') if instruction_text.strip() else None
              if instruction_bytes is not None and len(instruction_bytes) > 1048576:
                  raise ValueError('BONNI_INSTRUCTIONS_EXPANDED_TOO_LARGE')
              temporary = root / (filename + '.tmp')
              try:
                  # Stable timestamps and metadata: identical inputs give identical ZIPs.
                  # Stream large TARs so AMD64 and Raspi archives never fill Python memory.
                  with zipfile.ZipFile(temporary, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
                      for name, member in members:
                          info = zipfile.ZipInfo(member, date_time=(1980,1,1,0,0,0))
                          info.create_system = 3
                          info.external_attr = 0o100644 << 16
                          info.compress_type = zipfile.ZIP_DEFLATED
                          with open(root / name, 'rb') as source, archive.open(info, 'w', force_zip64=True) as destination:
                              shutil.copyfileobj(source, destination, length=1024*1024)
                      if instruction_bytes is not None:
                          info = zipfile.ZipInfo(instruction_member, date_time=(1980,1,1,0,0,0))
                          info.create_system = 3
                          info.external_attr = 0o100644 << 16
                          info.compress_type = zipfile.ZIP_DEFLATED
                          archive.writestr(info, instruction_bytes)
                  with zipfile.ZipFile(temporary) as archive:
                      expected_members = [member for name, member in members] + ([instruction_member] if instruction_bytes is not None else [])
                      if archive.namelist() != expected_members or archive.testzip() is not None:
                          raise ValueError('BONNI_BUNDLE_VERIFICATION_FAILED')
                      if instruction_bytes is not None and archive.read(instruction_member) != instruction_bytes:
                          raise ValueError('BONNI_INSTRUCTIONS_CONTENT_MISMATCH')
                      for name, member in members:
                          with archive.open(member) as source:
                              if hashlib.file_digest(source, 'sha256').hexdigest() != digest(root / name):
                                  raise ValueError('BONNI_BUNDLE_CONTENT_MISMATCH: ' + name)
                  os.replace(temporary, root / filename)
              finally:
                  temporary.unlink(missing_ok=True)
              (root / (filename + '.sha256')).write_text(digest(root / filename) + '  ' + filename + '\n')
              print('Verified package: ' + filename)
          
          BONNI_BUNDLES

      - name: Update repository code and preserve any existing release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_COMMIT: ${{ steps.bonni_source.outputs.source_commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node bonni-release-reconcile.mjs
          RELEASE_TAG=$(node -e 'process.stdout.write("v" + process.env.VERSION.replace(/-([a-z])$/, "+$1"))')
          git -C repository check-ref-format "refs/heads/${DEFAULT_BRANCH}"
          TAG_BASE=$(git -C repository ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)
          if [ -n "${TAG_BASE}" ]; then
            git -C repository push origin "${SOURCE_COMMIT}:refs/heads/${DEFAULT_BRANCH}"
          else
            git -C repository push --atomic origin "${SOURCE_COMMIT}:refs/heads/${DEFAULT_BRANCH}" "${SOURCE_COMMIT}:refs/tags/${RELEASE_TAG}"
          fi
          printf 'Source code: https://github.com/%s/tree/%s/SYSTEM\n' "${GITHUB_REPOSITORY}" "${SOURCE_COMMIT}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Promote the verified container to stable
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          DATABASE_DIGEST: ${{ steps.bonni_database.outputs.digest }}
          DIGEST: ${{ steps.bonni_image.outputs.digest }}
        run: |
          set -euo pipefail
          node bonni-release-reconcile.mjs
          test -n "${DIGEST}"
          RETAINED=()
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw > existing-image-index.json 2> existing-image-error.txt; then
            node --input-type=module > retained-image-refs.txt <<'BONNI_IMAGE_MERGE'
          import fs from "node:fs";
          function canonicalContainerPlatforms(raw) {
            const supported = ["linux/amd64", "linux/arm64", "linux/arm/v7"];
            if (!Array.isArray(raw) || !raw.length || raw.length > supported.length
              || new Set(raw).size !== raw.length || raw.some(p => !supported.includes(p))) {
              throw new Error("GITHUB_CONTAINER_PLATFORMS_INVALID");
            }
            return supported.filter(p => raw.includes(p));
          }
          function retainedContainerManifests(index, platforms) {
            const selected = canonicalContainerPlatforms(platforms);
            if (index?.schemaVersion !== 2 || !Array.isArray(index.manifests)) throw Error("BONNI_EXISTING_IMAGE_INDEX_INVALID");
            const retained = [], seen = new Set();
            for (const entry of index.manifests) {
              if (!/^sha256:[a-f0-9]{64}$/.test(entry.digest || "")) throw Error("BONNI_EXISTING_IMAGE_DIGEST_INVALID");
              if (entry.annotations?.["vnd.docker.reference.type"] === "attestation-manifest") continue;
              const p = entry.platform;
              if (!p?.os || !p?.architecture || p.os === "unknown" || p.architecture === "unknown") throw Error("BONNI_EXISTING_IMAGE_PLATFORM_INVALID");
              const platform = p.os + "/" + p.architecture + (p.architecture === "arm" ? "/" + p.variant : "");
              if (selected.includes(platform)) continue;
              if (seen.has(platform)) throw Error("BONNI_EXISTING_IMAGE_PLATFORM_AMBIGUOUS");
              seen.add(platform); retained.push(entry.digest);
            }
            for (const entry of index.manifests) {
              if (entry.annotations?.["vnd.docker.reference.type"] === "attestation-manifest"
                && retained.includes(entry.annotations["vnd.docker.reference.digest"])) retained.push(entry.digest);
            }
            return [...new Set(retained)];
          }
          const refs=retainedContainerManifests(JSON.parse(fs.readFileSync("existing-image-index.json","utf8")),process.env.PLATFORMS.split(","));
          for(const digest of refs) console.log(process.env.IMAGE+"@"+digest);
          
          BONNI_IMAGE_MERGE
            mapfile -t RETAINED < retained-image-refs.txt
          elif ! grep -Eqi 'manifest unknown|not found|no such manifest' existing-image-error.txt; then
            cat existing-image-error.txt >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:stable" "${IMAGE}@${DIGEST}" "${RETAINED[@]}"
          if [[ ",${PLATFORMS}," == *",linux/arm/v7,"* ]]; then
            docker buildx imagetools create --tag "${IMAGE}-database:${VERSION}-armv7" "${IMAGE}-database@${DATABASE_DIGEST}"
          fi

      - name: Reconcile only missing or changed Bonni downloads
        env:
          BONNI_RELEASE_PHASE: assets
        run: |
          set -euo pipefail
          node bonni-release-reconcile.mjs

      - name: Complete the existing release after all checks
        env:
          BONNI_RELEASE_PHASE: finalize
          SOURCE_COMMIT: ${{ steps.bonni_source.outputs.source_commit }}
          DIGEST: ${{ steps.bonni_image.outputs.digest }}
        run: |
          set -euo pipefail
          node bonni-release-reconcile.mjs

